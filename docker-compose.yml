services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: pipi-datacatalog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pipi_catalog
      POSTGRES_USER: pipi
      POSTGRES_PASSWORD: pipi_dev
    ports:
      # Keep the existing Windows PostgreSQL on 5432 during migration.
      # PiPi's Docker PostgreSQL/pgvector is exposed locally on 5433.
      - "5433:5432"
    volumes:
      - pipi_catalog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipi -d pipi_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pipi_catalog_pgdata:
