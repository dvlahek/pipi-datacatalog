services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pipi-datacatalog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pipi_catalog
      POSTGRES_USER: pipi
      POSTGRES_PASSWORD: pipi_dev
    ports:
      - "5432:5432"
    volumes:
      - pipi_catalog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipi -d pipi_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pipi_catalog_pgdata:
